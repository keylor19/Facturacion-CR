# Producción: servicio en línea con HTTPS y respaldos.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  api:
    # En producción la API solo se publica a través de Caddy (HTTPS)
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?Defina DOMINIO en .env (p. ej. api.sufacturacion.cr)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  respaldo:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DIAS_RETENCION: ${DIAS_RETENCION_RESPALDO:-14}
    volumes:
      - ./respaldos:/respaldos
      - ./deploy/respaldo.sh:/respaldo.sh:ro
    entrypoint: ["sh", "/respaldo.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
