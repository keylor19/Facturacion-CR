x-app: &app
  build: .
  env_file: .env
  volumes:
    - ./xsd:/app/xsd
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app
    # Aplica las migraciones antes de arrancar
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    # Solo accesible desde el propio servidor: exponer al exterior a través de
    # NGINX/Caddy con HTTPS.
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: celery -A workers.celery_app worker --loglevel=info

  beat:
    <<: *app
    command: celery -A workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: facturacion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: facturacion
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturacion"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
